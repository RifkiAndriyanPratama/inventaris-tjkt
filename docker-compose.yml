services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB}
    volumes:
      - .data:/var/lib/mysql
      - ./inventaris.sql:/docker-entrypoint-initdb.d/inventaris.sql
    ports:
      - "3306:3306"

  app:
    image: php:8.2-apache
    build: .
    depends_on:
      - db
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
